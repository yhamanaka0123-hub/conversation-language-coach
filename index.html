<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversation Language Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width app column centered on a cool "paper" ground; the
   highlighter marks phrases lifted from real conversations. */
:root {
  --paper: #eef1f6;
  --surface: #ffffff;
  --sunk: #f5f7fa;
  --ink: #18223a;
  --muted: #5a6479;
  --line: #dbe0e9;
  --accent: #2f4bd8;
  --on-accent: #ffffff;
  --marker: #ffe45c;
  --on-marker: #2b2500;
  --casual-bg: #e3f3ea; --casual-fg: #1c6a43;
  --pro-bg: #e6eafb;    --pro-fg: #2b3f9e;
  --good: #1d7a4b; --good-bg: #e2f4ea;
  --coach-bg: #fff8d6; --coach-fg: #4d4100;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1220; --surface: #161e31; --sunk: #111829; --ink: #e7ebf4; --muted: #9ba5ba;
    --line: #283350; --accent: #8fa2ff; --on-accent: #0d1220; --marker: #e8cf3f; --on-marker: #1c1800;
    --casual-bg: #12342a; --casual-fg: #8fdcb4; --pro-bg: #1c2550; --pro-fg: #b4c1ff;
    --good: #7fd8a8; --good-bg: #123526; --coach-bg: #2e2a12; --coach-fg: #f2e08a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1220; --surface: #161e31; --sunk: #111829; --ink: #e7ebf4; --muted: #9ba5ba;
  --line: #283350; --accent: #8fa2ff; --on-accent: #0d1220; --marker: #e8cf3f; --on-marker: #1c1800;
  --casual-bg: #12342a; --casual-fg: #8fdcb4; --pro-bg: #1c2550; --pro-fg: #b4c1ff;
  --good: #7fd8a8; --good-bg: #123526; --coach-bg: #2e2a12; --coach-fg: #f2e08a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
mark { background: var(--marker); color: var(--on-marker); padding: 0 .15em; border-radius: 2px; }

.proto-note { max-width: 440px; margin: 0 auto 10px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.proto-note button { background: none; border: 0; padding: 0; color: var(--accent); font-family: var(--font-mono); font-size: 11.5px; text-decoration: underline; }

.shell { max-width: 440px; margin: 0 auto; min-height: calc(100% - 40px); background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; }
.view { flex: 1; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.tabs { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabs .badge { font-family: var(--font-mono); font-size: 10px; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 6px; margin-left: 2px; }

.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.listening { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); background: var(--sunk); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px 4px 9px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #e0464e; box-shadow: 0 0 0 0 rgba(224,70,78,.5); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(224,70,78,0); } 100% { box-shadow: 0 0 0 0 rgba(224,70,78,0); } }
.hello h1 { font-size: 27px; font-weight: 700; }
.hello p { color: var(--muted); margin-top: 6px; }

.progress { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.progress-row strong { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }

.section { display: grid; gap: 10px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.section-head h2 { font-size: 17px; font-weight: 700; }

.convo { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.convo:hover { border-color: var(--accent); }
.convo h3 { font-size: 16.5px; font-weight: 700; }
.convo .counts { font-size: 13.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { justify-content: space-between; }

.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; }
.tag.casual { background: var(--casual-bg); color: var(--casual-fg); }
.tag.professional { background: var(--pro-bg); color: var(--pro-fg); }

.back { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.detail-head { display: grid; gap: 8px; }
.detail-head h1 { font-size: 24px; font-weight: 700; }
.summary { background: var(--sunk); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }

.ctx { display: grid; gap: 6px; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.item { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; background: var(--surface); }
.item.done { background: var(--sunk); }
.phrase { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.2; }
.quote { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.said { font-size: 14px; color: var(--muted); }
.alt { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.25; }
.why { font-size: 13.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.big { width: 100%; padding: 13px 16px; font-size: 15.5px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pill { font-size: 12.5px; font-weight: 700; border-radius: 99px; padding: 3px 10px; background: var(--sunk); color: var(--muted); }
.pill.saved { background: var(--pro-bg); color: var(--pro-fg); }
.pill.learned { background: var(--good-bg); color: var(--good); }
.undo { background: none; border: 0; padding: 0; font-size: 13px; color: var(--accent); text-decoration: underline; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13.5px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1px dashed var(--line); border-radius: 14px; display: grid; gap: 10px; justify-items: center; }

/* Practice */
.practice-head { display: grid; gap: 6px; }
.practice-head h1 { font-size: 21px; }
.targets { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13.5px; }
.chip.used { background: var(--good-bg); color: var(--good); border-color: transparent; text-decoration: none; font-weight: 700; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 16px; font-size: 15px; }
.msg.ai { align-self: flex-start; background: var(--sunk); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 5px; }
.msg.coach { align-self: stretch; max-width: none; background: var(--coach-bg); color: var(--coach-fg); border-radius: 10px; font-size: 13.5px; padding: 8px 12px; }
.msg .who { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; margin-bottom: 2px; }
.composer { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 18px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.composer form { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; }
.mic { width: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.mic.on { background: #e0464e; border-color: #e0464e; color: #fff; }
.mic svg { width: 20px; height: 20px; }
.send { flex: none; }
.composer .hint { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }

/* Recap + celebration */
.celebrate { position: relative; text-align: center; display: grid; gap: 14px; justify-items: center; padding-top: 28px; }
.celebrate canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.big-num { font-family: var(--font-display); font-size: 96px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.celebrate h1 { font-size: 26px; }
.learned-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.learned-list span { background: var(--marker); color: var(--on-marker); border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 14px; }

/* Progress report */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.stat strong { font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.chart { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; height: 170px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.chart .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); opacity: .6; }
.chart .goal span { position: absolute; left: 0; top: -17px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.col b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.col i { display: block; width: 100%; max-width: 34px; background: var(--line); border-radius: 6px 6px 0 0; }
.col.now i { background: var(--accent); }
.col.now b { color: var(--ink); font-weight: 700; }
.weeks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-align: center; }
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); }
.split .c { background: var(--casual-fg); }
.split .p { background: var(--pro-fg); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: currentColor; }
.legend .lc { color: var(--casual-fg); } .legend .lp { color: var(--pro-fg); }
.legend em { font-style: normal; color: var(--ink); font-weight: 700; margin-left: 4px; }
.term-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.term-row:last-child { border-bottom: 0; }
.term-row .phrase { font-size: 16px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13.5px; text-decoration: underline; justify-self: start; }

@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .bar span { transition: none; } }
</style>

<div class="proto-note">
  <span>Prototype · sample data · voice and AI partner are simulated</span>
  <button type="button" data-act="reset">Reset demo</button>
</div>
<div class="shell">
  <main class="view" id="view"></main>
  <div id="composer-slot"></div>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button type="button" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
      Conversations
    </button>
    <button type="button" data-act="tab" data-tab="bank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Vocab bank<span class="badge" id="bank-badge" hidden></span></span>
    </button>
    <button type="button" data-act="tab" data-tab="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Practice
    </button>
    <button type="button" data-act="tab" data-tab="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
      Progress
    </button>
  </nav>
</div>

<script>
// ---------- Sample data (one casual + one professional conversation) ----------
const GOAL = 5;
const USER = "Yuka";

const CONVOS = [
  {
    id: "maya", title: "Coffee chat with Maya", context: "casual",
    when: "Today · 3:40 PM", length: "18 min", people: "Maya (classmate)", place: "Free Speech Café",
    summary: "You caught up with Maya after class. She's buried in internship recruiting, invited you on a Sunday hike, and pushed your Friday dinner. You talked about her application to a design studio in SF.",
    partner: "Maya", partnerNote: "plays your classmate, same tone as today",
    script: [
      { ai: "Hey! Sorry I'm late, it's been a week. How are you holding up?", hint: "maya-r1",
        sample: "Honestly, I'm wiped out from all these assignments." },
      { ai: "Ugh, same. A few of us are doing the Tilden hike Sunday morning. You in?", hint: "maya-p4",
        sample: "Count me in! What time are you leaving?" },
      { ai: "Oh wait, I also said Friday dinner with you... I might be swamped. Is that okay?", hint: "maya-p2",
        sample: "No worries, let's take a rain check on Friday." },
      { ai: "Thanks. Oh, I applied to that design studio in SF. Total long shot, but fingers crossed. What are you up to Saturday?", hint: "maya-r2",
        sample: "Not much. I'm going to the farmers market. Want to come with?" }
    ],
    closing: "Okay, I gotta run. See you Sunday!"
  },
  {
    id: "sync", title: "Weekly product sync", context: "professional",
    when: "Mon · 10:00 AM", length: "32 min", people: "Daniel (PM), Lena (design)", place: "Zoom",
    summary: "Daniel ran the weekly sync. The team triaged a checkout bug, debated whether a fix could ship by Friday, and pushed the pricing discussion to next week. You gave an update on user interviews.",
    partner: "Daniel", partnerNote: "plays your PM in the same meeting",
    script: [
      { ai: "Morning! Before we dive in, any quick updates from your side?", hint: "sync-r1",
        sample: "If I could add one thing: three interviewees mentioned the checkout bug." },
      { ai: "Good to know. Can you give me a rough number on how many users hit it?", hint: "sync-p2",
        sample: "A ballpark figure would be around two hundred a week." },
      { ai: "Okay. Can we ship the fix by Friday?", hint: "sync-r2",
        sample: "Friday might be tight. Could we aim for Monday instead?" },
      { ai: "Fair. Should design be involved before we commit?", hint: "sync-p4",
        sample: "Yes, let's loop in Lena before we commit to a date." }
    ],
    closing: "Great, thanks everyone. Let's circle back on pricing next week."
  }
];

// kind "phrase": something the other person said that is likely new.
// kind "rephrase": something the user said, with a context-fit alternative.
const ITEMS = [
  { id: "maya-p1", convo: "maya", kind: "phrase", text: "I'm swamped", meaning: "I'm extremely busy; too much to do.",
    sentence: "Honestly, I'm swamped this week with recruiting stuff.", hl: "I'm swamped", speaker: "Maya", at: "02:14", match: ["swamped"] },
  { id: "maya-p2", convo: "maya", kind: "phrase", text: "take a rain check", meaning: "Politely postpone an invitation to another time.",
    sentence: "Can I take a rain check on Friday dinner?", hl: "take a rain check", speaker: "Maya", at: "09:51", match: ["rain check"] },
  { id: "maya-p3", convo: "maya", kind: "phrase", text: "a long shot", meaning: "Something unlikely to succeed, but worth trying.",
    sentence: "Applying there is a long shot, but why not.", hl: "a long shot", speaker: "Maya", at: "12:30", match: ["long shot"] },
  { id: "maya-p4", convo: "maya", kind: "phrase", text: "count me in", meaning: "Yes, include me; I want to join.",
    sentence: "If you're doing the hike Sunday, count me in.", hl: "count me in", speaker: "Maya", at: "15:02", match: ["count me in"] },
  { id: "maya-r1", convo: "maya", kind: "rephrase", said: "I am very tired because of many assignments.", at: "01:40",
    alt: { casual: "I'm wiped out from all these assignments.", professional: "I've been stretched a bit thin with deadlines this week." },
    why: { casual: "With a friend, a vivid everyday phrase sounds more relaxed than “very tired because of”.",
           professional: "At work, this signals a heavy load without sounding like a complaint." },
    match: { casual: ["wiped out"], professional: ["stretched", "thin"] } },
  { id: "maya-r2", convo: "maya", kind: "rephrase", said: "Shall we go together?", at: "16:20",
    alt: { casual: "Want to come with?", professional: "Would you like to join us?" },
    why: { casual: "“Shall we” is correct but sounds formal between friends.",
           professional: "A polite question works for colleagues or a manager." },
    match: { casual: ["come with", "wanna join", "want to join"], professional: ["would you like to join"] } },

  { id: "sync-p1", convo: "sync", kind: "phrase", text: "circle back", meaning: "Return to a topic later.",
    sentence: "Let's circle back on pricing next week.", hl: "circle back", speaker: "Daniel", at: "28:45", match: ["circle back"] },
  { id: "sync-p2", convo: "sync", kind: "phrase", text: "a ballpark figure", meaning: "A rough estimate, not an exact number.",
    sentence: "Can someone give me a ballpark figure on affected users?", hl: "a ballpark figure", speaker: "Daniel", at: "06:12", match: ["ballpark"] },
  { id: "sync-p3", convo: "sync", kind: "phrase", text: "move the needle", meaning: "Make a noticeable difference to a result.",
    sentence: "Fixing checkout will actually move the needle on conversion.", hl: "move the needle", speaker: "Lena", at: "11:37", match: ["move the needle"] },
  { id: "sync-p4", convo: "sync", kind: "phrase", text: "loop in", meaning: "Include someone in a discussion or email thread.",
    sentence: "Let's loop in the design team before we commit.", hl: "loop in", speaker: "Daniel", at: "19:03", match: ["loop in"] },
  { id: "sync-r1", convo: "sync", kind: "rephrase", said: "I want to say my opinion.", at: "04:05",
    alt: { professional: "If I could add one thing...", casual: "Can I jump in for a sec?" },
    why: { professional: "A softer opener lets you take the floor without sounding abrupt in a meeting.",
           casual: "Among friends, a quick, light way to cut in." },
    match: { professional: ["add one thing", "quick thought"], casual: ["jump in"] } },

// ---------- State ----------
const KEY = "clc-demo-v1";
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const convoById = Object.fromEntries(CONVOS.map(c => [c.id, c]));

function fresh() {
  const status = {};
  ITEMS.forEach(i => { status[i.id] = i.seed || "new"; });
  return { v: 1, status, ctx: {}, celebrated: false, sessions: 0 };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load();
let route = { name: "home" };
let bankFilter = null;
let session = null;
let micTimer = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ctxOf = cid => S.ctx[cid] || convoById[cid].context;
const ctxLabel = c => c === "casual" ? "Casual" : "Professional";
const statusOf = id => S.status[id];
const learnedCount = () => ITEMS.filter(i => statusOf(i.id) === "learned").length;
const itemsIn = cid => ITEMS.filter(i => i.convo === cid);
const practiceText = i => i.kind === "phrase" ? i.text : i.alt[ctxOf(i.convo)];
const matchWords = i => i.kind === "phrase" ? i.match : i.match[ctxOf(i.convo)];
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ");
const uses = (text, i) => matchWords(i).some(w => norm(text).includes(w));
const tag = c => `<span class="tag ${c}">${ctxLabel(c)}</span>`;
const highlight = (s, h) => h ? esc(s).replace(esc(h), `<mark>${esc(h)}</mark>`) : esc(s);

function go(r) { route = r; render(); window.scrollTo(0, 0); }

function itemActions(i) {
  const s = statusOf(i.id);
  if (s === "new") return `<div class="actions">

  const label = { practice: ["saved", "In vocab bank · to practice"], known: ["", "Marked as known · hidden"], learned: ["learned", "Learned ✓"] }[s];
  return `<div class="row"><span class="pill ${label[0]}">${label[1]}</span>${s !== "learned" ? `<button class="undo" type="button" data-act="mark" data-id="${i.id}" data-to="new">Undo</button>` : ""}</div>`;

function phraseCard(i, withSource) {
  const src = withSource ? sourceLine(i) : `<span class="meta">${esc(i.speaker)} · ${i.at}</span>`;
  return `<article class="item ${statusOf(i.id) === "new" ? "" : "done"}">

    <p>${esc(i.meaning)}</p>
    ${i.sentence ? `<p class="quote">“${highlight(i.sentence, i.hl)}”</p>` : ""}

}

function rephraseCard(i, withSource) {
  const c = ctxOf(i.convo);
  return `<article class="item ${statusOf(i.id) === "new" ? "" : "done"}">

  v.innerHTML = {

  }[route.name]();

// ---------- Practice logic (keyword match on saved phrases; no model call) ----------
function startPractice(cid) {
  const c = convoById[cid];
  const targets = itemsIn(cid).filter(i => statusOf(i.id) === "practice").map(i => i.id);
  if (!targets.length) return go({ name: "convo", id: cid });
  session = { cid, turn: 0, targets, used: [], log: [
    { who: "coach", text: `${c.partner} is played by AI, based on today's conversation. Reply the way you would in real life, and try to use the phrases above.` },
    { who: "ai", text: c.script[0].ai }
  ], done: false };
  go({ name: "session" });
}

function reply(text) {
  const c = convoById[session.cid];
  const step = c.script[session.turn];
  session.log.push({ who: "me", text });
  const hits = session.targets.filter(id => !session.used.includes(id) && uses(text, byId[id]));
  session.used.push(...hits);
  if (hits.length) {
    session.log.push({ who: "coach", text: `Nice, “${hits.map(id => practiceText(byId[id]).replace(/[.?!…]+$/, "")).join("” and “")}” fits a ${ctxLabel(ctxOf(c.id)).toLowerCase()} conversation.` });
  } else if (session.targets.includes(step.hint) && !session.used.includes(step.hint)) {
    session.log.push({ who: "coach", text: `Good reply. This was a natural spot for “${practiceText(byId[step.hint]).replace(/[.?!…]+$/, "")}”. Try it next time.` });
  }
  session.turn++;
  if (session.turn < c.script.length) {
    session.log.push({ who: "ai", text: c.script[session.turn].ai });
  } else {
    session.log.push({ who: "ai", text: c.closing });
    session.done = true;
  }
  render();
}

function finish() {
  session.used.forEach(id => { S.status[id] = "learned"; });
  const r = { cid: session.cid, targets: session.targets, used: session.used.slice() };
  session = null;
  S.sessions = (S.sessions || 0) + 1;
  const hitGoal = learnedCount() >= GOAL && !S.celebrated;
  if (hitGoal) S.celebrated = true;
  save();
  go({ name: hitGoal ? "celebrate" : "recap", r });
}

function simulateMic(btn) {
  if (micTimer) return;
  const input = document.getElementById("reply");
  const text = convoById[session.cid].script[session.turn].sample;
  let k = 0;
  input.value = "";
  btn.classList.add("on");
  input.placeholder = "Listening…";
  micTimer = setInterval(() => {
    k += 2;
    input.value = text.slice(0, k);
    if (k >= text.length) { clearInterval(micTimer); micTimer = null; btn.classList.remove("on"); input.focus(); }
  }, 35);
}

function confetti() {
  const cv = document.getElementById("confetti");
  if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d");
  const w = cv.width = cv.offsetWidth * devicePixelRatio, h = cv.height = cv.offsetHeight * devicePixelRatio;
  const styles = getComputedStyle(document.documentElement);
  const colors = ["--marker", "--accent", "--casual-fg", "--pro-fg"].map(t => styles.getPropertyValue(t).trim());
  const bits = Array.from({ length: 90 }, () => ({ x: Math.random() * w, y: -Math.random() * h * .5, r: (3 + Math.random() * 4) * devicePixelRatio,
    vy: (1.5 + Math.random() * 2.5) * devicePixelRatio, vx: (Math.random() - .5) * 1.5 * devicePixelRatio, a: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, w, h);
    bits.forEach(b => { b.y += b.vy; b.x += b.vx; b.a += .1; ctx.fillStyle = b.c; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); ctx.restore(); });
    if (++frames < 220 && document.getElementById("confetti") === cv) requestAnimationFrame(tick); else ctx.clearRect(0, 0, w, h);
  })();
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === "tab") { bankFilter = null; go({ name: el.dataset.tab }); }
  else if (act === "open") go({ name: "convo", id });
  else if (act === "mark") { S.status[id] = el.dataset.to; save(); render(); }
  else if (act === "ctx") { S.ctx[id] = el.dataset.ctx; save(); render(); }
  else if (act === "filter") { bankFilter = el.dataset.f; render(); }
  else if (act === "start") startPractice(id);
  else if (act === "quit") { session = null; go({ name: "practice" }); }
  else if (act === "insert") { const inp = document.getElementById("reply"); if (inp) { inp.value = (inp.value ? inp.value.trim() + " " : "") + practiceText(byId[id]); inp.focus(); } }
  else if (act === "mic") simulateMic(el);
  else if (act === "finish") finish();
  else if (act === "recap") go({ name: "recap", r: route.r });
  else if (act === "reset") { S = fresh(); save(); session = null; bankFilter = null; go({ name: "home" }); }
});

document.addEventListener("submit", e => {
  if (e.target.id !== "say") return;
  e.preventDefault();
  const v = document.getElementById("reply").value.trim();
  if (v && !micTimer) reply(v);
});

render();
</script>

</html>
